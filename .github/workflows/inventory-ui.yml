name: Inventory UI regression

on:
  push:
    branches: [feature/inventory-ui-polish, feature/inventory-dense-hidpi, feature/inventory-ui-scale]
  pull_request:
    paths:
      - 'app/src/*inventory*'
      - 'app/src/host_text*'
      - 'app/src/host_video*'
      - 'app/src/display_scaling*'
      - 'app/src/main.c'
      - 'tests/*inventory*'
      - 'tests/test_host_text.c'
      - 'tests/test_display_scaling.c'
      - '**/CMakeLists.txt'
      - '.github/workflows/inventory-ui.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned emulator
        run: git submodule update --init --depth 1 third_party/mgba
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libfreetype-dev fonts-dejavu-core zlib1g-dev ninja-build
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew list sdl2 >/dev/null 2>&1 || brew install sdl2
      - name: Build the application and tests
        run: |
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-native --parallel 3
      - name: Native text, desktop layout and existing regressions
        run: ctest --test-dir build-native --output-on-failure
