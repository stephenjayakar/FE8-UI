name: Validate and publish voxel cursor fixes
on:
  push:
    branches: [voxel-live-staging-20260916]
permissions:
  contents: read
env:
  FEATURE_PARENT: d285b39fe4979ac69cf35e40e04344c19be22da7
  PATCH_SHA256: 16c188ee9fdfebe14c1a327cef7cde2a2dd444b2f4dfb94cdac76393edcd4701
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply locally tested source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, zlib
          payload = '''
          
          '''
          patch = zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
          pathlib.Path(os.environ['RUNNER_TEMP'], 'cursor-hover.patch').write_bytes(patch)
          PY
          git checkout --detach "$FEATURE_PARENT"
          git apply --check "$RUNNER_TEMP/cursor-hover.patch"
          git apply --index "$RUNNER_TEMP/cursor-hover.patch"
          git diff --cached --check
          git diff --cached --stat
      - uses: actions/upload-artifact@v4
        with:
          name: verified-cursor-hover-patch
          path: ${{ runner.temp }}/cursor-hover.patch
          if-no-files-found: error
          retention-days: 7
  validate:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_PARENT }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-cursor-hover-patch
          path: ${{ runner.temp }}/cursor-patch
      - name: Apply verified source and initialize pinned core
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP'], 'cursor-patch/cursor-hover.patch')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == os.environ['PATCH_SHA256']
          PY
          git apply --index "$RUNNER_TEMP/cursor-patch/cursor-hover.patch"
          git diff --cached --check
          git submodule update --init --depth 1 third_party/mgba
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build pkg-config libsdl2-dev libfreetype6-dev zlib1g-dev fonts-dejavu-core xvfb xauth libgl1-mesa-dri
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja sdl2
      - name: Build complete native client and tests
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$RUNNER_OS" = macOS ]; then args+=("-DCMAKE_OSX_ARCHITECTURES=$(uname -m)"); fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFE8_BUILD_TESTS=ON "${args[@]}"
          cmake --build build --parallel 3
      - name: Run suite including native Settings and display compositor
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a env SDL_AUDIODRIVER=dummy ctest --test-dir build --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voxel-cursor-validation-${{ runner.os }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voxel-live
      - uses: actions/download-artifact@v4
        with:
          name: verified-cursor-hover-patch
          path: ${{ runner.temp }}/cursor-patch
      - name: Publish only validated source to voxel-live
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FEATURE_PARENT"
          python3 - <<'PY'
          import hashlib, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP'], 'cursor-patch/cursor-hover.patch')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == os.environ['PATCH_SHA256']
          PY
          git apply --index "$RUNNER_TEMP/cursor-patch/cursor-hover.patch"
          git diff --cached --check
          git -c user.name=OpenAI -c user.email=noreply@openai.com commit -m 'Keep voxel cursor stable and render native hover billboards'
          git push origin HEAD:refs/heads/voxel-live
          git rev-parse HEAD
