name: Validate and publish voxel prototype
on:
  push:
    branches: [voxel-live-staging-20260916]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix macOS voxel hotkey binding and dispatch
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 9627dc4ff66cbeef70e0f09ce4a056c2668deae5
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/macos_settings.m')
          source = path.read_text()

          old = '''            } else if (scancode != SDL_SCANCODE_UNKNOWN &&\n                    tag >= FE8_HOTKEY_TAG_BASE &&\n                    tag < FE8_HOTKEY_TAG_BASE + FE8_HOST_HOTKEY_COUNT) {\n                enum Fe8HostHotkey hotkey =\n                    (enum Fe8HostHotkey)(tag - FE8_HOTKEY_TAG_BASE);\n                self.settings->hotkeys[hotkey] = scancode;\n                ++self.settings->revision;\n                [NSUserDefaults.standardUserDefaults setInteger:scancode\n                    forKey:hotkeyBindingKey(hotkey)];\n                [self stopListening];\n            }\n'''
          new = '''            } else if (scancode != SDL_SCANCODE_UNKNOWN &&\n                    tag >= FE8_HOTKEY_TAG_BASE &&\n                    tag < FE8_HOTKEY_TAG_BASE + FE8_HOST_HOTKEY_COUNT) {\n                enum Fe8HostHotkey hotkey =\n                    (enum Fe8HostHotkey)(tag - FE8_HOTKEY_TAG_BASE);\n                /* Frontend hotkeys are actions, not GBA buttons. Let one key\n                 * own one action so an older saved binding cannot silently\n                 * consume a newer one earlier in the event loop. */\n                for (int other = 0; other < FE8_HOST_HOTKEY_COUNT; ++other) {\n                    if (other == hotkey || self.settings->hotkeys[other] != scancode)\n                        continue;\n                    self.settings->hotkeys[other] = SDL_SCANCODE_UNKNOWN;\n                    [NSUserDefaults.standardUserDefaults setInteger:SDL_SCANCODE_UNKNOWN\n                        forKey:hotkeyBindingKey((enum Fe8HostHotkey)other)];\n                }\n                self.settings->hotkeys[hotkey] = scancode;\n                ++self.settings->revision;\n                [NSUserDefaults.standardUserDefaults setInteger:scancode\n                    forKey:hotkeyBindingKey(hotkey)];\n                [self stopListening];\n                for (NSButton *button in self.bindingButtons)\n                    button.title = [self titleForBindingTag:button.tag];\n            }\n'''
          assert source.count(old) == 1
          source = source.replace(old, new)

          old = '''    NSTextField *hotkeyHeading = [NSTextField labelWithString:@"Hotkeys"];\n    hotkeyHeading.frame = NSMakeRect(24, 140, 380, 24);\n    hotkeyHeading.font = [NSFont boldSystemFontOfSize:13];\n    [content addSubview:hotkeyHeading];\n    for (i = 0; i < FE8_HOST_HOTKEY_COUNT; ++i) {\n        CGFloat y = 108 - i * 29;\n'''
          new = '''    NSTextField *hotkeyHeading = [NSTextField labelWithString:@"Hotkeys"];\n    hotkeyHeading.frame = NSMakeRect(24, 150, 380, 24);\n    hotkeyHeading.font = [NSFont boldSystemFontOfSize:13];\n    [content addSubview:hotkeyHeading];\n    for (i = 0; i < FE8_HOST_HOTKEY_COUNT; ++i) {\n        /* Five rows fit fully inside the fixed settings window. The previous\n         * 29-point spacing put the Voxel Renderer button at y=-8. */\n        CGFloat y = 118 - i * 27;\n'''
          assert source.count(old) == 1
          source = source.replace(old, new)
          path.write_text(source)

          path = Path('app/src/main.c')
          source = path.read_text()
          old = '''            if ((event.type == SDL_KEYDOWN || event.type == SDL_KEYUP) &&\n                    (fe8_host_hotkey_for_scancode(&settings, event.key.keysym.scancode) &\n                        (UINT32_C(1) << FE8_HOST_HOTKEY_TOGGLE_EXTENSIONS))) {\n                if (event.type == SDL_KEYDOWN && !event.key.repeat) {\n                    fe8_macos_toggle_extensions(&settings);\n                    fe8_presentation_reset(&presentation);\n                    frozen_valid = 0;\n                    visual_profile_active = 0;\n                    fe8_mouse_cancel(&mouse);\n                    pan.dragging = 0;\n                    pointer_canvas_valid = 0;\n                    pointer_tile_valid = 0;\n                    fprintf(stderr, "Extended renderer: %s\\n",\n                        settings.extensions_enabled ? "on" : "off");\n                }\n                continue;\n            }\n            if ((event.type == SDL_KEYDOWN || event.type == SDL_KEYUP) &&\n                    (fe8_host_hotkey_for_scancode(&settings, event.key.keysym.scancode) &\n                        (UINT32_C(1) << FE8_HOST_HOTKEY_TOGGLE_VOXEL))) {\n                if (event.type == SDL_KEYDOWN && !event.key.repeat) {\n                    options.voxel = !options.voxel;\n                    fe8_mouse_cancel(&mouse);\n                    pointer_canvas_valid = pointer_tile_valid = 0;\n                    voxel_active = voxel_drag = 0;\n                    pan.dragging = 0;\n                    fprintf(stderr,\n                        "Voxel presentation: %s (read-only runtime geometry)\\n",\n                        options.voxel ? "enabled" : "disabled");\n                }\n                continue;\n            }\n'''
          new = '''            /* Voxel gets first claim on an accidental duplicate binding. This\n             * matters for upgrades where F7 may already be stored for another\n             * action; rebinding in Settings will remove the duplicate. */\n            if ((event.type == SDL_KEYDOWN || event.type == SDL_KEYUP) &&\n                    (fe8_host_hotkey_for_scancode(&settings, event.key.keysym.scancode) &\n                        (UINT32_C(1) << FE8_HOST_HOTKEY_TOGGLE_VOXEL))) {\n                if (event.type == SDL_KEYDOWN && !event.key.repeat) {\n                    options.voxel = !options.voxel;\n                    fe8_mouse_cancel(&mouse);\n                    pointer_canvas_valid = pointer_tile_valid = 0;\n                    voxel_active = voxel_drag = 0;\n                    pan.dragging = 0;\n                    fprintf(stderr,\n                        "Voxel presentation: %s (read-only runtime geometry)\\n",\n                        options.voxel ? "enabled" : "disabled");\n                }\n                continue;\n            }\n            if ((event.type == SDL_KEYDOWN || event.type == SDL_KEYUP) &&\n                    (fe8_host_hotkey_for_scancode(&settings, event.key.keysym.scancode) &\n                        (UINT32_C(1) << FE8_HOST_HOTKEY_TOGGLE_EXTENSIONS))) {\n                if (event.type == SDL_KEYDOWN && !event.key.repeat) {\n                    fe8_macos_toggle_extensions(&settings);\n                    fe8_presentation_reset(&presentation);\n                    frozen_valid = 0;\n                    visual_profile_active = 0;\n                    fe8_mouse_cancel(&mouse);\n                    pan.dragging = 0;\n                    pointer_canvas_valid = 0;\n                    pointer_tile_valid = 0;\n                    fprintf(stderr, "Extended renderer: %s\\n",\n                        settings.extensions_enabled ? "on" : "off");\n                }\n                continue;\n            }\n'''
          assert source.count(old) == 1
          source = source.replace(old, new)

          old = '''                    fe8_host_text_draw(&text,24,h-29,w-48,20,\n                        "F7  original view     [ ]  orbit     Scroll  zoom     Shift-drag  pan     C  focus     Home  reset",\n                        12,UINT32_C(0xFFC1B8A9),FE8_HOST_TEXT_REGULAR,0);\n'''
          new = '''                    char voxel_controls[256];\n                    const char *voxel_key = SDL_GetScancodeName(\n                        settings.hotkeys[FE8_HOST_HOTKEY_TOGGLE_VOXEL]);\n                    snprintf(voxel_controls, sizeof(voxel_controls),\n                        "%s  original view     [ ]  orbit     Scroll  zoom     Shift-drag  pan     C  focus     Home  reset",\n                        voxel_key && *voxel_key ? voxel_key : "Voxel hotkey");\n                    fe8_host_text_draw(&text,24,h-29,w-48,20, voxel_controls,\n                        12,UINT32_C(0xFFC1B8A9),FE8_HOST_TEXT_REGULAR,0);\n'''
          assert source.count(old) == 1
          source = source.replace(old, new)
          path.write_text(source)
          PY
          git add app/src/macos_settings.m app/src/main.c
          git diff --cached --check
          grep -q 'CGFloat y = 118 - i \* 27' app/src/macos_settings.m
          grep -q 'Voxel gets first claim' app/src/main.c
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake ninja-build pkg-config libsdl2-dev libfreetype-dev fonts-dejavu-core zlib1g-dev
          git submodule update --init --depth 1 third_party/mgba
      - name: Build and test the actual feature tree
        env:
          BUILD_JOBS: 2
          BUILD_TYPE: RelWithDebInfo
        run: bash scripts/build-linux-workspace.sh
      - name: Publish macOS voxel hotkey fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9627dc4ff66cbeef70e0f09ce4a056c2668deae5
          git -c user.name='OpenAI' -c user.email='noreply@openai.com' commit -m 'Fix macOS voxel hotkey rebinding and duplicate dispatch'
          git push origin HEAD:refs/heads/voxel-live
          git rev-parse HEAD
      - name: Upload Linux prototype executable
        uses: actions/upload-artifact@v4
        with:
          name: voxel-live-linux
          path: build-linux/fe8-mgba-sdl
          if-no-files-found: error
          retention-days: 7
