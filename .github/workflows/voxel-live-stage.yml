name: Validate and publish voxel fixes
on:
  push:
    branches: [voxel-live-staging-20260916]
permissions:
  contents: read
env:
  FEATURE_PARENT: 97504a73396297422993eec13fef21ec3c97ccfd
  PAYLOAD_REVISION: fb1102e3948ca24f843f48b737396a9916652054
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply exact locally tested edits
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$FEATURE_PARENT"
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, re, subprocess
          from pathlib import Path
          source = subprocess.check_output(['git', 'show', os.environ['PAYLOAD_REVISION'] + ':.github/workflows/voxel-live-stage.yml'], text=True)
          encoded = re.search(r'  VOXEL_EDITS: \|\n(.*?)\njobs:', source, re.S).group(1)
          # Correct two transport transcription errors, then verify the entire
          # decoded manifest against the hash of the locally tested edits.
          encoded = encoded.replace('fhKnMnmeRP', 'fhKnmeRP').replace('XsklLZj', 'XskLZj')
          raw = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == 'b322be550c234976b1be9d70455ae69665ceca78d575eeb253f102dabfc42bae'
          edits = json.loads(raw)
          for name, (before, after, ops) in edits.items():
              path = Path(name)
              old = path.read_text() if path.exists() else ''
              assert hashlib.sha256(old.encode()).hexdigest() == before, name
              lines = old.splitlines(keepends=True)
              for start, end, replacement in reversed(ops):
                  lines[start:end] = [replacement]
              text = ''.join(lines)
              assert hashlib.sha256(text.encode()).hexdigest() == after, name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text)
          subprocess.run(['git', 'add', '--', *edits], check=True)
          PY
          git diff --cached --check
          git diff --cached --stat
          git diff --cached --binary > /tmp/voxel-fix.patch
      - uses: actions/upload-artifact@v4
        with:
          name: validated-voxel-source-patch
          path: /tmp/voxel-fix.patch
          retention-days: 7
  validate:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 97504a73396297422993eec13fef21ec3c97ccfd
      - uses: actions/download-artifact@v4
        with:
          name: validated-voxel-source-patch
          path: /tmp/voxel-source
      - name: Apply verified feature patch and initialize pinned emulator
        run: git apply --index /tmp/voxel-source/voxel-fix.patch && git submodule update --init --depth 1 third_party/mgba
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build libsdl2-dev libfreetype6-dev zlib1g-dev fonts-dejavu-core
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja sdl2
      - name: Build native application and regression tests
        shell: bash
        run: |
          args=()
          if [ "$RUNNER_OS" = macOS ]; then args+=("-DCMAKE_OSX_ARCHITECTURES=$(uname -m)"); fi
          cmake -S . -B build-voxel-fix -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFE8_BUILD_TESTS=ON "${args[@]}"
          cmake --build build-voxel-fix --parallel 3
      - name: Run full suite including native Cocoa binding events on macOS
        run: ctest --test-dir build-voxel-fix --output-on-failure
      - name: Capture actual macOS Settings after V binding and enabling voxels
        if: runner.os == 'macOS'
        run: build-voxel-fix/tests/test_macos_settings build-voxel-fix/voxel-captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voxel-fix-validation-${{ runner.os }}
          path: |
            build-voxel-fix/voxel-captures/*.png
            build-voxel-fix/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 97504a73396297422993eec13fef21ec3c97ccfd
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: validated-voxel-source-patch
          path: /tmp/voxel-source
      - name: Publish only validated source changes to voxel-live
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FEATURE_PARENT"
          test "$(git ls-remote origin refs/heads/voxel-live | cut -f1)" = "$FEATURE_PARENT"
          git apply --index /tmp/voxel-source/voxel-fix.patch
          git diff --cached --check
          git -c user.name=OpenAI -c user.email=noreply@openai.com commit -m 'Fix macOS library key capture and Retina voxel activation'
          git push origin HEAD:refs/heads/voxel-live
          git rev-parse HEAD
