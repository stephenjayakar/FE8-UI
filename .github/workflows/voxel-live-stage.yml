name: Validate and publish voxel inspection fixes
on:
  push:
    branches: [voxel-live-staging-20260916]
    paths: ['.github/workflows/voxel-live-stage.yml']
permissions:
  contents: read
concurrency:
  group: voxel-inspection-publish
  cancel-in-progress: true
env:
  FEATURE_PARENT: 1baf252db8c30fd4505d719ff6ed0cfd7e6f908b
  PAYLOAD_SHA256: 81a1ec86131baacf0c92440a392ae5f7f150c4a85b2c4aec0685a77a1a857b88
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tree: ${{ steps.patch.outputs.tree }}
      digest: ${{ steps.patch.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact tested inspection/settings patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          root = pathlib.Path('.github/staging')
          encoded = ''.join((root / f'inspection-edits.{i}.b64part').read_text() for i in range(2))
          payload = base64.b64decode(encoded)
          assert hashlib.sha256(payload).hexdigest() == os.environ['PAYLOAD_SHA256']
          edits = json.loads(lzma.decompress(payload))
          manifest = json.loads((root / 'inspection-manifest.json').read_text())
          assert len(edits) == len(manifest) == 10
          subprocess.run(['git','checkout','--detach',os.environ['FEATURE_PARENT']],check=True)
          for item in edits:
              path = pathlib.Path(item['path'])
              lines = path.read_text().splitlines(keepends=True) if path.exists() else []
              for start,count,replacement in reversed(item['edits']):
                  lines[start:start+count] = replacement.splitlines(keepends=True)
              data = ''.join(lines).encode()
              assert hashlib.sha256(data).hexdigest() == manifest[str(path)], str(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          subprocess.run(['git','add','--',*manifest],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verified-inspection'
          out.mkdir(parents=True, exist_ok=True)
          patch = subprocess.check_output(['git','diff','--cached','--binary','--full-index'])
          (out / 'feature.patch').write_bytes(patch)
          tree = subprocess.check_output(['git','write-tree'],text=True).strip()
          digest = hashlib.sha256(patch).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('tree='+tree+'\n')
              f.write('digest='+digest+'\n')
          print('Verified tree', tree, 'patch', digest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-voxel-inspection-source
          path: ${{ runner.temp }}/verified-inspection
          retention-days: 7
  validate:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_PARENT }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-voxel-inspection-source
          path: ${{ runner.temp }}/verified-inspection
      - name: Apply verified source and initialize pinned emulator
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$RUNNER_TEMP/verified-inspection/feature.patch" | cut -d' ' -f1)" = "${{ needs.prepare.outputs.digest }}"
          git apply --index "$RUNNER_TEMP/verified-inspection/feature.patch"
          test "$(git write-tree)" = "${{ needs.prepare.outputs.tree }}"
          git submodule update --init --depth 1 third_party/mgba
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build libsdl2-dev libfreetype6-dev zlib1g-dev fonts-dejavu-core xvfb libgl1-mesa-dri
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja sdl2
      - name: Build and test complete native frontend
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$RUNNER_OS" = macOS ]; then args+=("-DCMAKE_OSX_ARCHITECTURES=$(uname -m)"); fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFE8_BUILD_TESTS=ON "${args[@]}"
          cmake --build build --parallel 3
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a env SDL_RENDER_DRIVER=opengl ctest --test-dir build --output-on-failure
          else
            ctest --test-dir build --output-on-failure
            mkdir -p build/inspection-settings
            build/tests/test_macos_settings build/inspection-settings
          fi
          test "$(git write-tree)" = "${{ needs.prepare.outputs.tree }}"
  publish:
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_PARENT }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-voxel-inspection-source
          path: ${{ runner.temp }}/verified-inspection
      - name: Publish validated fixes to voxel-live
        shell: bash
        run: |
          set -euo pipefail
          git apply --index "$RUNNER_TEMP/verified-inspection/feature.patch"
          test "$(git write-tree)" = "${{ needs.prepare.outputs.tree }}"
          remote=$(git ls-remote --heads origin refs/heads/voxel-live | cut -f1)
          test "$remote" = "$FEATURE_PARENT"
          git -c user.name='OpenAI' -c user.email='noreply@openai.com' commit -m 'Keep voxel inspection in 3D and expose GPU backend'
          git push origin HEAD:refs/heads/voxel-live
          echo "Published $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
