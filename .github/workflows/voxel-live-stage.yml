name: Publish validated OpenGL tactical movement
on:
  push:
    branches: [voxel-live-staging-20260916]
    paths: ['.github/workflows/voxel-live-stage.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: voxel-gpu-publish
  cancel-in-progress: false
env:
  FEATURE_PARENT: 65551898f5c3b36d2228e4c9e55390750059564f
  VALIDATED_RUN: '35182536150'
  EXPECTED_TREE: 03e4ee15bb122226d1799a93aff194dad8060e3b
  PATCH_SHA256: 0784ad0490d1652442f3066afc99995954d5102587c7bca8294ab2d0816db153
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_PARENT }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-opengl-tactics-source
          path: ${{ runner.temp }}/verified-gpu
          repository: stephenjayakar/FE8-UI
          run-id: ${{ env.VALIDATED_RUN }}
          github-token: ${{ github.token }}
      - name: Publish already validated functional source to voxel-live
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verified-gpu/feature.patch'
          assert hashlib.sha256(p.read_bytes()).hexdigest() == os.environ['PATCH_SHA256']
          PY
          git apply --index "$RUNNER_TEMP/verified-gpu/feature.patch"
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"

          # The validated patch also contains a standalone regression workflow.
          # This GitHub App may not update workflow files on the target branch,
          # so publish the functional code/tests/docs only. Linux and macOS
          # already passed that workflow's checks in VALIDATED_RUN above.
          git reset HEAD -- .github/workflows/voxel-gpu-tactics.yml
          rm -f .github/workflows/voxel-gpu-tactics.yml
          test ! -e .github/workflows/voxel-gpu-tactics.yml

          remote=$(git ls-remote --heads origin refs/heads/voxel-live | cut -f1)
          test "$remote" = "$FEATURE_PARENT"
          git -c user.name='OpenAI' -c user.email='noreply@openai.com' commit -m 'Render voxel terrain on GPU and keep tactical movement in 3D'
          git push origin HEAD:refs/heads/voxel-live
          echo "Published $(git rev-parse HEAD) to voxel-live." >> "$GITHUB_STEP_SUMMARY"
