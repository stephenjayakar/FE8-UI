name: Validate and publish distinct voxel buildings
on:
  push:
    branches: [voxel-live-staging-20260916]
permissions:
  contents: read
env:
  FEATURE_PARENT: 6dad5b6c4a46e4caeed2ccb344988ce286644254
  PATCH_SHA256: 3ea0ac7732a9acd49bae0e32fb5258a0b0d72b86404e96cd33b6fc81ad135ec8
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply exact locally tested source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib
          payload = '''
          
          
          
          '''
          patch = lzma.decompress(base64.b64decode(''.join(payload.split()), validate=True))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
          pathlib.Path(os.environ['RUNNER_TEMP'], 'voxel-buildings.patch').write_bytes(patch)
          PY
          git checkout --detach "$FEATURE_PARENT"
          git apply --check "$RUNNER_TEMP/voxel-buildings.patch"
          git apply "$RUNNER_TEMP/voxel-buildings.patch"
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: verified-voxel-buildings-patch
          path: ${{ runner.temp }}/voxel-buildings.patch
          if-no-files-found: error
          retention-days: 7
  validate:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_PARENT }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-voxel-buildings-patch
          path: ${{ runner.temp }}/building-patch
      - name: Apply verified source and initialize pinned core
        shell: bash
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/building-patch/voxel-buildings.patch"
          git submodule update --init --depth 1 third_party/mgba
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build libsdl2-dev libfreetype6-dev zlib1g-dev fonts-dejavu-core xvfb
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja sdl2
      - name: Build complete native frontend and regressions
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$RUNNER_OS" = macOS ]; then args+=("-DCMAKE_OSX_ARCHITECTURES=$(uname -m)"); fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFE8_BUILD_TESTS=ON "${args[@]}"
          cmake --build build --parallel 3
      - name: Run full suite and actual platform compositor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/building-validation
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a ctest --test-dir build --output-on-failure | tee build/building-validation/tests.log
          else
            ctest --test-dir build --output-on-failure | tee build/building-validation/tests.log
          fi
      - name: Render deterministic building gallery with native C renderer
        shell: bash
        run: |
          set -euo pipefail
          build/tests/test_voxel_buildings build/building-validation | tee build/building-validation/buildings.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voxel-buildings-validation-${{ runner.os }}
          path: |
            build/building-validation
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voxel-live
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-voxel-buildings-patch
          path: ${{ runner.temp }}/building-patch
      - name: Publish only validated source to voxel-live
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FEATURE_PARENT"
          git apply --index "$RUNNER_TEMP/building-patch/voxel-buildings.patch"
          git diff --cached --check
          git -c user.name='OpenAI' -c user.email='noreply@openai.com' commit -m 'Generate distinct armory, vendor, arena and landmark building models'
          git push origin HEAD:refs/heads/voxel-live
          git rev-parse HEAD
