name: Validate and publish voxel prototype
on:
  push:
    branches: [voxel-live-staging-20260916]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified mouse transition fix to feature parent
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 2bf67b35167eb44940683748d24d8ff7e0f30893
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('app/src/main.c')
          source = path.read_text()
          old = '        if (was_voxel_active != voxel_active) {\n            if (mouse.active) fe8_mouse_cancel(&mouse);\n            pointer_canvas_valid = pointer_tile_valid = 0;\n'
          new = '        if (was_voxel_active != voxel_active) {\n            /* Screen coordinates belong to the previous projection. A queued\n             * mouse path already owns a validated world-tile target, however;\n             * preserve it so cursor animation/native fallback cannot eat A. */\n            pointer_canvas_valid = pointer_tile_valid = 0;\n'
          assert source.count(old) == 1
          source = source.replace(old, new)
          assert hashlib.sha256(source.encode()).hexdigest() == 'b0137922ce2af03c6a4c3a77b5ea875949e0095f4fdac1dc80ec4b355ae11293'
          path.write_text(source)
          PY
          git add app/src/main.c
          git diff --cached --check
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake ninja-build pkg-config libsdl2-dev libfreetype-dev fonts-dejavu-core zlib1g-dev
          git submodule update --init --depth 1 third_party/mgba
      - name: Build and test the actual feature tree
        env:
          BUILD_JOBS: 2
          BUILD_TYPE: RelWithDebInfo
        run: bash scripts/build-linux-workspace.sh
      - name: Publish fast-forward feature fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2bf67b35167eb44940683748d24d8ff7e0f30893
          git -c user.name='OpenAI' -c user.email='noreply@openai.com' commit -m 'Preserve queued world-tile clicks across voxel presentation transitions'
          git push origin HEAD:refs/heads/voxel-live
          git rev-parse HEAD
      - name: Upload Linux prototype executable
        uses: actions/upload-artifact@v4
        with:
          name: voxel-live-linux
          path: build-linux/fe8-mgba-sdl
          if-no-files-found: error
          retention-days: 7
