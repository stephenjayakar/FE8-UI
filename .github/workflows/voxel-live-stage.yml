name: Validate and publish voxel performance
on:
  push:
    branches: [voxel-live-staging-20260916]
permissions:
  contents: read
env:
  FEATURE_PARENT: dbec13a12252e38f5ba05d02e704296937a38c2d
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply locally tested source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib, zlib
          payload = '''
          
          
          
          '''
          data = zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(data).hexdigest() == '5772ba9b43c8eaac3670cb6e9f69c168ff232bd9bb78604a39e7d476508e8bb7'
          pathlib.Path('/tmp/voxel-performance.patch').write_bytes(data)
          PY
          git checkout --detach "$FEATURE_PARENT"
          git apply --check /tmp/voxel-performance.patch
          git apply --index /tmp/voxel-performance.patch
          git diff --cached --check
      - uses: actions/upload-artifact@v4
        with:
          name: voxel-performance-source-patch
          path: /tmp/voxel-performance.patch
          retention-days: 7
  validate:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dbec13a12252e38f5ba05d02e704296937a38c2d
      - uses: actions/download-artifact@v4
        with:
          name: voxel-performance-source-patch
          path: /tmp/voxel-patch
      - name: Apply patch and initialize pinned core
        run: |
          git apply /tmp/voxel-patch/voxel-performance.patch
          git submodule update --init --depth 1 third_party/mgba
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build libsdl2-dev libfreetype6-dev zlib1g-dev fonts-dejavu-core xvfb xauth
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja sdl2
      - name: Build native frontend and tests
        shell: bash
        run: |
          args=()
          if [ "$RUNNER_OS" = macOS ]; then args+=("-DCMAKE_OSX_ARCHITECTURES=$(uname -m)"); fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFE8_BUILD_TESTS=ON "${args[@]}"
          cmake --build build --parallel 3
      - name: Run suite and actual display compositor
        shell: bash
        run: |
          mkdir -p build/validation
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a ctest --test-dir build --output-on-failure
            xvfb-run -a build/tests/test_video_scene build/validation/compositor.ppm
          else
            ctest --test-dir build --output-on-failure
            build/tests/test_video_scene build/validation/compositor.ppm
            build/tests/test_macos_settings build/validation
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voxel-performance-validation-${{ runner.os }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/validation/*
          retention-days: 7
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dbec13a12252e38f5ba05d02e704296937a38c2d
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: voxel-performance-source-patch
          path: /tmp/voxel-patch
      - name: Publish validated source to voxel-live
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FEATURE_PARENT"
          git apply --index /tmp/voxel-patch/voxel-performance.patch
          git diff --cached --check
          git -c user.name=OpenAI -c user.email=noreply@openai.com commit -m 'Speed up voxel presentation and use camera-facing unit billboards'
          git push origin HEAD:refs/heads/voxel-live
          git rev-parse HEAD
