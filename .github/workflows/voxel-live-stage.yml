name: Validate and publish voxel prototype
on:
  push:
    branches: [voxel-live-staging-20260916]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add bindable voxel renderer hotkey
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach efb95ce22043a0d89c26e22d2463d4796efc527a
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/host_settings.h')
          source = path.read_text()
          old = '''    FE8_HOST_HOTKEY_QUICK_LOAD,\n    FE8_HOST_HOTKEY_TOGGLE_EXTENSIONS,\n    FE8_HOST_HOTKEY_COUNT\n'''
          new = '''    FE8_HOST_HOTKEY_QUICK_LOAD,\n    FE8_HOST_HOTKEY_TOGGLE_EXTENSIONS,\n    FE8_HOST_HOTKEY_TOGGLE_VOXEL,\n    FE8_HOST_HOTKEY_COUNT\n'''
          assert source.count(old) == 1
          path.write_text(source.replace(old, new))

          path = Path('app/src/host_settings.c')
          source = path.read_text()
          old = '''        SDL_SCANCODE_F8,\n        SDL_SCANCODE_F6,\n    };'''
          new = '''        SDL_SCANCODE_F8,\n        SDL_SCANCODE_F6,\n        SDL_SCANCODE_F7,\n    };'''
          assert source.count(old) == 1
          source = source.replace(old, new)
          old = '''        "Speed Up", "Quick Save", "Quick Load", "Extended Renderer"\n    };'''
          new = '''        "Speed Up", "Quick Save", "Quick Load", "Extended Renderer",\n        "Voxel Renderer"\n    };'''
          assert source.count(old) == 1
          path.write_text(source.replace(old, new))

          path = Path('app/src/main.c')
          source = path.read_text()
          marker = '''            if ((event.type == SDL_KEYDOWN || event.type == SDL_KEYUP) &&\n                    (fe8_host_hotkey_for_scancode(&settings, event.key.keysym.scancode) &\n                        (UINT32_C(1) << FE8_HOST_HOTKEY_TOGGLE_EXTENSIONS))) {\n                if (event.type == SDL_KEYDOWN && !event.key.repeat) {\n                    fe8_macos_toggle_extensions(&settings);\n                    fe8_presentation_reset(&presentation);\n                    frozen_valid = 0;\n                    visual_profile_active = 0;\n                    fe8_mouse_cancel(&mouse);\n                    pan.dragging = 0;\n                    pointer_canvas_valid = 0;\n                    pointer_tile_valid = 0;\n                    fprintf(stderr, "Extended renderer: %s\\n",\n                        settings.extensions_enabled ? "on" : "off");\n                }\n                continue;\n            }\n'''
          addition = marker + '''            if ((event.type == SDL_KEYDOWN || event.type == SDL_KEYUP) &&\n                    (fe8_host_hotkey_for_scancode(&settings, event.key.keysym.scancode) &\n                        (UINT32_C(1) << FE8_HOST_HOTKEY_TOGGLE_VOXEL))) {\n                if (event.type == SDL_KEYDOWN && !event.key.repeat) {\n                    options.voxel = !options.voxel;\n                    fe8_mouse_cancel(&mouse);\n                    pointer_canvas_valid = pointer_tile_valid = 0;\n                    voxel_active = voxel_drag = 0;\n                    pan.dragging = 0;\n                    fprintf(stderr,\n                        "Voxel presentation: %s (read-only runtime geometry)\\n",\n                        options.voxel ? "enabled" : "disabled");\n                }\n                continue;\n            }\n'''
          assert source.count(marker) == 1
          source = source.replace(marker, addition)
          old = '''                if (key == SDLK_F7) {\n                    options.voxel = !options.voxel;\n                    fe8_mouse_cancel(&mouse); pointer_canvas_valid = pointer_tile_valid = 0;\n                    voxel_active = voxel_drag = 0; pan.dragging = 0;\n                    fprintf(stderr, "Voxel presentation: %s (read-only runtime geometry)\\n", options.voxel ? "enabled" : "disabled");\n                    continue;\n                }\n'''
          assert source.count(old) == 1
          source = source.replace(old, '')
          path.write_text(source)

          path = Path('tests/test_host_settings.c')
          source = path.read_text()
          old = '''    assert(settings.hotkeys[FE8_HOST_HOTKEY_TOGGLE_EXTENSIONS] == SDL_SCANCODE_F6);\n    assert(fe8_host_hotkey_for_scancode(&settings, SDL_SCANCODE_F6) ==\n        (UINT32_C(1) << FE8_HOST_HOTKEY_TOGGLE_EXTENSIONS));\n'''
          new = '''    assert(settings.hotkeys[FE8_HOST_HOTKEY_TOGGLE_EXTENSIONS] == SDL_SCANCODE_F6);\n    assert(settings.hotkeys[FE8_HOST_HOTKEY_TOGGLE_VOXEL] == SDL_SCANCODE_F7);\n    assert(fe8_host_hotkey_for_scancode(&settings, SDL_SCANCODE_F6) ==\n        (UINT32_C(1) << FE8_HOST_HOTKEY_TOGGLE_EXTENSIONS));\n    assert(fe8_host_hotkey_for_scancode(&settings, SDL_SCANCODE_F7) ==\n        (UINT32_C(1) << FE8_HOST_HOTKEY_TOGGLE_VOXEL));\n'''
          assert source.count(old) == 1
          source = source.replace(old, new)
          old = '''    assert(fe8_host_hotkey_for_scancode(&settings, SDL_SCANCODE_F7) ==\n        (UINT32_C(1) << FE8_HOST_HOTKEY_TOGGLE_EXTENSIONS));\n'''
          new = '''    assert(fe8_host_hotkey_for_scancode(&settings, SDL_SCANCODE_F7) ==\n        ((UINT32_C(1) << FE8_HOST_HOTKEY_TOGGLE_EXTENSIONS) |\n         (UINT32_C(1) << FE8_HOST_HOTKEY_TOGGLE_VOXEL)));\n    assert(strcmp(fe8_host_hotkey_name(FE8_HOST_HOTKEY_TOGGLE_VOXEL),\n        "Voxel Renderer") == 0);\n'''
          assert source.count(old) == 1
          path.write_text(source.replace(old, new))
          PY
          git add app/src/host_settings.h app/src/host_settings.c app/src/main.c tests/test_host_settings.c
          git diff --cached --check
          grep -q 'FE8_HOST_HOTKEY_TOGGLE_VOXEL' app/src/host_settings.h
          grep -q '"Voxel Renderer"' app/src/host_settings.c
          grep -q 'FE8_HOST_HOTKEY_TOGGLE_VOXEL' app/src/main.c
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake ninja-build pkg-config libsdl2-dev libfreetype-dev fonts-dejavu-core zlib1g-dev
          git submodule update --init --depth 1 third_party/mgba
      - name: Build and test the actual feature tree
        env:
          BUILD_JOBS: 2
          BUILD_TYPE: RelWithDebInfo
        run: bash scripts/build-linux-workspace.sh
      - name: Publish bindable voxel hotkey
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = efb95ce22043a0d89c26e22d2463d4796efc527a
          git -c user.name='OpenAI' -c user.email='noreply@openai.com' commit -m 'Make voxel renderer toggle a bindable hotkey'
          git push origin HEAD:refs/heads/voxel-live
          git rev-parse HEAD
      - name: Upload Linux prototype executable
        uses: actions/upload-artifact@v4
        with:
          name: voxel-live-linux
          path: build-linux/fe8-mgba-sdl
          if-no-files-found: error
          retention-days: 7
