name: Validate Armory loadout workspace
on:
  push:
    branches: [feature/armory-loadout-workspace]
    paths: [.github/workflows/armory-loadout-publish.yml]
permissions:
  contents: read
env:
  FILE_HASHES: |
    {
      ".github/workflows/armory-branch-validation.yml": "2e4491964ae9c3e310c6323bd6d6d30471500cfece0ef381ee1249f0c13daf60",
      "CMakeLists.txt": "a6910a2049f88f54737bb249582a9ad45e5914d7a8fbd1785f935429e58edeab",
      "README.md": "c6994621a04321fb50caa9a8d1c02781c1b27efc58a3d7d4e7e293322693a012",
      "app/src/inventory_desktop.c": "0ee7d99f30e17bdb8274e12cec76931848bb33d9911dbfb658111d9fd61edd6a",
      "app/src/inventory_desktop.h": "c3dd0291b50af61e4eb521e5b62a437ffd8dd59a611fbe1d1329dd414d05565c",
      "app/src/inventory_history.c": "e04e70000981663aa927afa7988f781f19e11171757f0dca300656b33f033d69",
      "app/src/inventory_history.h": "3c351f9a11ecc9309dfaf6baae51ecc2f14445d07c8981faf392d03f21b63482",
      "app/src/main.c": "c2883f6bc95efe03ab4626c72ee861c9b508d8672ce239b96835525cfd076b86",
      "app/src/prebattle_inventory_ui.c": "840511644f080184fd2e40e835e66d25a0d16d4c2908d8d098d69695bd277032",
      "app/src/prebattle_inventory_ui.h": "83a427720eb56b21bac3ba009e414d136b49bc3d7d0bde4b3771a7cc099e13e2",
      "docs/inventory-armory.md": "6f350b7c46449ac8ad3d4b49bdde83ca7482f562d90f5210cade10653094dc78",
      "tests/CMakeLists.txt": "8f8a350305d36087278c6a197a1eec8572ec63bdb7ada69629b80d91b8011925",
      "tests/test_inventory_history.c": "043df57551c48e5ee38d7fad498521342b8e3dfb967e7339e2715ac6c43b5920",
      "tests/test_inventory_loadouts.c": "583485623c12d08310f481e31399be8ac2626ce0a78738c1bba425f1f2c9515e",
      "tests/test_inventory_rom.c": "2545ebc3bb62a28fcc93395b5f0d81c3af4995795be17ef44e201fc8654e69e0"
    }
  ARMORY_APPLY: |
    import base64, gzip, hashlib, json, os, subprocess, urllib.request
    from pathlib import Path
    assert os.environ['GITHUB_REF'] == 'refs/heads/feature/armory-loadout-workspace'
    shas = ['19d4b47e4b38833444e998cfd4ef85714bd111db', '1ea68b27ddaf1665ebf8a8b8545665be43956137', '79cf590125120d8ae0a2b1e4049f702ab8e8a809', '947a9fdc07710b8452851cd19edb315125e79fbd', '1a4c1ec0e1096c77ce67ad514e5409d06f896c08']
    expected_parts = ['e0aaf76dfcb6628126f69921f0650e7e6542d77c', '1ea68b27ddaf1665ebf8a8b8545665be43956137', '79cf590125120d8ae0a2b1e4049f702ab8e8a809', '947a9fdc07710b8452851cd19edb315125e79fbd', '0422ee709f7f8305f59251df99e00651dd65492d']
    parts = []
    for sha in shas:
        url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/' + sha
        request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
        with urllib.request.urlopen(request, timeout=30) as response:
            parts.append(base64.b64decode(json.load(response)['content']))
    # Repair two known transport transcription errors; verify each corrected
    # fragment, the complete source patch, and every resulting source file.
    assert parts[0].count(b'D3s9v9vNtzh') == 1
    parts[0] = parts[0].replace(b'D3s9v9vNtzh', b'D3s9v9tzh', 1)
    assert parts[4].count(b'N0fjEzi4zi4Uf/XWa') == 1
    parts[4] = parts[4].replace(b'N0fjEzi4zi4Uf/XWa', b'N0fjEzi4Uf/XWa', 1)
    for part, expected in zip(parts, expected_parts):
        assert hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() == expected
    patch = gzip.decompress(base64.b64decode(b''.join(parts)))
    assert hashlib.sha256(patch).hexdigest() == 'c8a209228c14db11682fac97a566c33af0af2963eef747c679e96d7ddb52094d'
    expected_files = json.loads(os.environ['FILE_HASHES'])
    names = subprocess.check_output(['git', 'apply', '--numstat', '-'], input=patch).decode().splitlines()
    assert {line.split('\t')[2] for line in names} == set(expected_files)
    subprocess.run(['git', 'apply', '--check', '--whitespace=error', '-'], input=patch, check=True)
    subprocess.run(['git', 'apply', '--whitespace=error', '-'], input=patch, check=True)
    for name, digest in expected_files.items():
        assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
    print('Verified and applied 15 source/test/documentation files. No ROMs, saves, fonts, or extracted assets.')
jobs:
  validate:
    if: github.ref == 'refs/heads/feature/armory-loadout-workspace'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-verified source patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 -c "$ARMORY_APPLY"
      - name: Initialize pinned emulator dependency
        run: git submodule update --init --depth 1 third_party/mgba
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build libsdl2-dev libfreetype6-dev zlib1g-dev fonts-dejavu-core
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja sdl2
      - name: Build complete application
        shell: bash
        run: |
          args=()
          if [ "$RUNNER_OS" = macOS ]; then args+=("-DCMAKE_OSX_ARCHITECTURES=$(uname -m)"); fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFE8_BUILD_TESTS=ON "${args[@]}"
          cmake --build build --parallel 3
      - name: Full regression suite
        shell: bash
        run: ctest --test-dir build --output-on-failure | tee build/ctest.log
      - name: Capture native Armory and loadout layouts
        shell: bash
        run: |
          mkdir -p build/armory-captures
          build/tests/test_inventory_workspace build/armory-captures
          build/tests/test_inventory_loadouts build/armory-captures
      - uses: actions/upload-artifact@v4
        with:
          name: armory-loadout-captures-${{ runner.os }}
          path: |
            build/armory-captures/*.ppm
            build/ctest.log
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: validate
    if: github.ref == 'refs/heads/feature/armory-loadout-workspace'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/armory-loadout-workspace
      - name: Publish validated source and remove temporary transport
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -c "$ARMORY_APPLY"
          git diff --check
          python3 -c 'import json,os,subprocess; subprocess.run(["git","add","--",*json.loads(os.environ["FILE_HASHES"])],check=True)'
          git rm .github/workflows/armory-loadout-publish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add direct army loadouts, nearby swaps and guarded session undo" -m "Add By unit/Supply workspace, contextual usability and Carry actions, local five-slot swap picker, explicit comparison targets, filter counts and compact details. Keep 32 expected-value-checked undo commands per paused session with precise feedback. Local 30/30 tests include both supplied ROMs and exact multi-step RAM restoration; UI/history sanitizers and native Linux/macOS builds validated. No ROMs, saves, fonts or extracted assets."
          git push origin HEAD:refs/heads/feature/armory-loadout-workspace
