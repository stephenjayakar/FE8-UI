name: Temporary mouse target patch

on:
  push:
    branches: [tmp/mouse-target-lock]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/mouse-target-lock
          fetch-depth: 0
      - name: Patch target selector handling
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%s | grep -q '^Handle locked mouse target selectors$'; then
            exit 0
          fi
          echo '' | base64 -d > /tmp/patch-mouse-target.py
          python3 /tmp/patch-mouse-target.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main.c
          git commit -m 'Handle locked mouse target selectors'
          git push origin HEAD:tmp/mouse-target-lock
