name: Release builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git tag or commit to build
        default: main
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - name: Read release version
        run: |
          version=$(sed -n 's/^project(fe8_extended_frontend VERSION \([^ ]*\) LANGUAGES C)/\1/p' CMakeLists.txt)
          test -n "$version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - run: git submodule update --init --depth 1 third_party/mgba
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libsdl2-dev libfreetype-dev fonts-dejavu-core zlib1g-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew list sdl2 >/dev/null 2>&1 || brew install sdl2
      - name: Build and test
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release --parallel 3
          ctest --test-dir build-release --output-on-failure
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app=build-release/fe8-mgba-sdl.app
          binary="$app/Contents/MacOS/fe8-mgba-sdl"
          mkdir -p "$app/Contents/Frameworks" "$app/Contents/Resources/ThirdParty/SDL2" dist
          sdl=$(otool -L "$binary" | awk '/libSDL2.*dylib/ {print $1}')
          test -n "$sdl"
          cp -L "$sdl" "$app/Contents/Frameworks/libSDL2.dylib"
          cp "$(brew --prefix sdl2)/LICENSE.txt" "$app/Contents/Resources/ThirdParty/SDL2/"
          install_name_tool -change "$sdl" @executable_path/../Frameworks/libSDL2.dylib "$binary"
          install_name_tool -id @executable_path/../Frameworks/libSDL2.dylib "$app/Contents/Frameworks/libSDL2.dylib"
          # Homebrew may supply sdl2-compat, which loads SDL3 with dlopen.
          # This dependency is invisible to otool -L; keep it beside the shim.
          if strings "$app/Contents/Frameworks/libSDL2.dylib" | grep 'sdl2-compat' > /dev/null; then
            sdl3_prefix=$(brew --prefix sdl3)
            mkdir -p "$app/Contents/Resources/ThirdParty/SDL3"
            cp -L "$sdl3_prefix/lib/libSDL3.dylib" "$app/Contents/Frameworks/libSDL3.dylib"
            cp "$sdl3_prefix/LICENSE.txt" "$app/Contents/Resources/ThirdParty/SDL3/"
            install_name_tool -id @loader_path/libSDL3.dylib "$app/Contents/Frameworks/libSDL3.dylib"
          fi
          otool -L "$binary" "$app/Contents/Frameworks/"*.dylib | tee build-release/dependencies.txt
          ! grep -E '/opt/homebrew|/usr/local/(opt|Cellar)' build-release/dependencies.txt
          for library in "$app/Contents/Frameworks/"*.dylib; do
            codesign --force --sign - "$library"
          done
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          python3 - "$binary" <<'PY'
          import os, pathlib, subprocess, sys
          binary = pathlib.Path(sys.argv[1]).resolve()
          result = subprocess.run([str(binary), "--help"], capture_output=True, text=True,
                                  timeout=30, env={**os.environ, "DYLD_PRINT_LIBRARIES": "1"})
          output = result.stdout + result.stderr
          pathlib.Path("build-release/help.txt").write_text(output)
          assert result.returncode in (0, 1), output
          assert "Usage:" in output, output
          if (binary.parent.parent / "Frameworks/libSDL3.dylib").exists():
              loaded = [line for line in output.splitlines() if "libSDL3" in line]
              assert loaded and all("/Contents/Frameworks/libSDL3.dylib" in line for line in loaded), output
          PY
          grep -q 'Usage:' build-release/help.txt
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/FE8-UI-${RELEASE_VERSION}-macOS-arm64.zip"
      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          name="FE8-UI-${RELEASE_VERSION}-Linux-x86_64"
          mkdir -p "$name/licenses" dist
          cp build-release/fe8-mgba-sdl LICENSE THIRD_PARTY_NOTICES.md "$name/"
          cp third_party/mgba/LICENSE "$name/licenses/mGBA.txt"
          ldd "$name/fe8-mgba-sdl" | tee "$name/dependencies.txt"
          ! grep -q 'not found' "$name/dependencies.txt"
          "$name/fe8-mgba-sdl" --help > build-release/help.txt 2>&1 || test "$?" -eq 1
          grep -q 'Usage:' build-release/help.txt
          printf '%s\n' 'Built for Ubuntu 24.04 x86-64 (glibc 2.39 or newer).' 'Install runtime dependencies: sudo apt install libsdl2-2.0-0 libfreetype6 fonts-dejavu-core zlib1g' 'Run: ./fe8-mgba-sdl --rom /path/to/game.gba' 'A graphical desktop and your own ROM are required.' > "$name/README.txt"
          tar -czf "dist/$name.tar.gz" "$name"
      - name: Package source with pinned mGBA
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/FE8-UI-${RELEASE_VERSION}-source-with-mgba"
          mkdir -p "$source/third_party/mgba" dist
          git archive HEAD | tar -x -C "$source"
          git -C third_party/mgba archive HEAD -- . ':!cinema' | tar -x -C "$source/third_party/mgba"
          tar -C "$RUNNER_TEMP" -czf "dist/FE8-UI-${RELEASE_VERSION}-source-with-mgba.tar.gz" "$(basename "$source")"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - name: Build and test Windows executable
        shell: pwsh
        run: ./scripts/build-windows.ps1 -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT
      - name: Check startup and name release package
        shell: pwsh
        run: |
          $output = & ./build-windows/dist/bin/fe8-mgba-sdl.exe --help 2>&1
          $status = $LASTEXITCODE
          if ($status -notin @(0, 1) -or "$output" -notmatch 'Usage:') {
            throw "Command-line startup failed (exit $status)"
          }
          $version = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'version-string'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build-windows/fe8-ui-windows-x64.zip "dist/FE8-UI-$version-Windows-x64.zip"
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: release-Windows
          path: dist/*
          if-no-files-found: error
