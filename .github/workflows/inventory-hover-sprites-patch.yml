name: Inventory hover sprite refinement

on:
  push:
    branches: [inventory-portrait-sprite]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inventory-portrait-sprite
          fetch-depth: 0
      - name: Apply hover and animation refinement
        run: python3 scripts/apply_inventory_hover_refinement.py
      - name: Commit source changes and clean temporary files
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inventory-hover-sprites-patch.yml scripts/apply_inventory_hover_refinement.py
          git add app/src/prebattle_inventory.h app/src/prebattle_inventory.c app/src/prebattle_inventory_ui.h app/src/prebattle_inventory_ui.c app/src/inventory_desktop.c app/src/main.c tests/test_prebattle_inventory.c
          git commit -m "Animate sprites on portrait hover"
          git push origin HEAD:inventory-portrait-sprite
