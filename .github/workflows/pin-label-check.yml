name: Native pin label polish
on:
  push:
    branches: [feature/armory-pinned-units]
    paths: [.github/workflows/pin-label-check.yml]
permissions:
  contents: read
env:
  APPLY: |
    import hashlib
    from pathlib import Path
    p = Path('app/src/inventory_desktop.c')
    assert hashlib.sha256(p.read_bytes()).hexdigest() == '9a8edec160839fbf3aed544b5609ca26d13bb03688e1c6bb2919e321b3f8674e'
    s = p.read_text()
    edits = {
        'l->identity_width-42,sy+6,36,18': 'l->identity_width-48,sy+6,42,18',
        'l->identity_width-42,y+6,36,18': 'l->identity_width-48,y+6,42,18',
        'l->identity_width-(compact?58:102)': 'l->identity_width-(compact?64:108)',
    }
    for before, after in edits.items():
        assert s.count(before) == 1
        s = s.replace(before, after)
    p.write_text(s)
    assert hashlib.sha256(p.read_bytes()).hexdigest() == '06e957e12868b87b355a69fd59e14c628d9622cfece4e9664b04e06d6441e88a'
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c "$APPLY"
        shell: bash
      - name: Resolve validation dependency without changing the committed pin
        shell: bash
        run: |
          if ! git submodule update --init --depth 1 third_party/mgba; then
            echo '::warning::Existing d79a492 pin unavailable upstream; validating against afd6f14 without changing the gitlink.'
            git -C third_party/mgba fetch --depth 1 origin afd6f14eaf8bd35214ed3fb9dc69a92bfc3877a9
            git -C third_party/mgba checkout --detach afd6f14eaf8bd35214ed3fb9dc69a92bfc3877a9
          fi
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build libsdl2-dev libfreetype-dev zlib1g-dev fonts-dejavu-core
      - if: runner.os == 'macOS'
        run: brew install ninja sdl2
      - name: Build and test complete application
        shell: bash
        run: |
          args=()
          if [ "$RUNNER_OS" = macOS ]; then args+=("-DCMAKE_OSX_ARCHITECTURES=$(uname -m)"); fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFE8_BUILD_TESTS=ON "${args[@]}"
          cmake --build build --parallel 3
          ctest --test-dir build --output-on-failure
          mkdir -p build/captures
          build/tests/test_inventory_pins build/captures
      - uses: actions/upload-artifact@v4
        with:
          name: final-pinned-loadouts-${{ runner.os }}
          path: build/captures/*.ppm
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/armory-pinned-units
      - name: Publish checked label spacing
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -c "$APPLY"
          git diff --check
          git add app/src/inventory_desktop.c
          git rm .github/workflows/pin-label-check.yml
          test "$(git write-tree)" = b67bfadc76b9beb9b9aa03df757840318048bd22
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep Unpin readable with native macOS font metrics" -m "Widen the pin control and its shared hit target while keeping the adjacent name separate. Native Linux/macOS full regression suites pass using previously verified mGBA afd6f14; the existing unavailable main gitlink is preserved."
          git push origin HEAD:refs/heads/feature/armory-pinned-units
