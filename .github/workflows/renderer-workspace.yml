name: Renderer workspace dependencies
on:
  push:
    branches: [fix/renderer-toggle-centering]
    paths: [.github/workflows/renderer-workspace.yml]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    steps:
      - name: Package FreeType development files for offline validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfreetype-dev
          mkdir -p "$RUNNER_TEMP/freetype-sdk/include" "$RUNNER_TEMP/freetype-sdk/lib"
          cp -a /usr/include/freetype2 "$RUNNER_TEMP/freetype-sdk/include/"
          cp -L /usr/lib/x86_64-linux-gnu/libfreetype.so "$RUNNER_TEMP/freetype-sdk/lib/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/freetype-sdk.tar.gz" freetype-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-freetype-sdk
          path: ${{ runner.temp }}/freetype-sdk.tar.gz
          retention-days: 1
