name: Apply tested renderer change
on:
  push:
    branches: [fix/renderer-toggle-centering]
    paths: [.github/workflows/renderer-workspace.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-verified local change
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          encoded = ''
          encoded = encoded.replace('sPDXXItKA8', 'sPDXItKA8').replace('NdZZ4YII', 'NdZ4YII')
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == 'c9a97d2e0f36fe8cb822ad6f4de6fb7064025413a0fd73346a3efe13e55fada1'
          pathlib.Path('/tmp/renderer.patch').write_bytes(patch)
          PY
          git apply --check /tmp/renderer.patch
          git apply /tmp/renderer.patch
          git diff --check
          git config user.name 'Stephen Jayakar'
          git config user.email 'aj12ay@gmail.com'
          git add app/src tests README.md
          git commit -m 'feat: toggle extended rendering and center native screens' -m 'Add a remappable E hotkey and synchronized macOS menu toggle. Center native frames whenever the map cannot be validated, discard stale frozen placement, and reacquire fresh terrain after menus. Keep inventory independent of renderer preference and preserve valid zoom anchors during reacquisition. Add settings and presentation regressions.'
          git push origin HEAD:refs/heads/fix/renderer-toggle-centering
