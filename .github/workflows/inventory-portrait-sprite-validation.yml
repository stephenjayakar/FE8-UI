name: Inventory portrait sprite validation

on:
  push:
    branches: [inventory-portrait-sprite]

permissions:
  contents: write

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Use verified mGBA revision
        shell: bash
        run: |
          rm -rf third_party/mgba
          git clone --filter=blob:none https://github.com/mgba-emu/mgba.git third_party/mgba
          git -C third_party/mgba checkout afd6f14eaf8bd35214ed3fb9dc69a92bfc3877a9
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libfreetype-dev fonts-dejavu-core zlib1g-dev ninja-build
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew list sdl2 >/dev/null 2>&1 || brew install sdl2
      - name: Build
        run: |
          cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-native --parallel 3
      - name: Full regression suite
        run: ctest --test-dir build-native --output-on-failure
      - name: Upload Linux ROM harnesses
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: inventory-rom-harnesses
          if-no-files-found: error
          path: |
            build-native/tests/test_inventory_rom
            build-native/tests/test_inventory_rom_dense
            build-native/tests/test_prebattle_inventory
            build-native/tests/test_inventory_desktop
            build-native/tests/test_inventory_workspace
          retention-days: 1

  cleanup:
    if: always()
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inventory-portrait-sprite
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inventory-portrait-sprite-validation.yml
          git commit -m "Remove temporary portrait sprite validation"
          git push origin HEAD:inventory-portrait-sprite
