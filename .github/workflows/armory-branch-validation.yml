name: Armory native regression

on:
  push:
    paths:
      - app/src/**
      - tests/**
      - CMakeLists.txt
      - third_party/mgba
      - .github/workflows/armory-branch-validation.yml
  pull_request:
    paths:
      - app/src/**
      - tests/**
      - CMakeLists.txt
      - third_party/mgba
      - .github/workflows/armory-branch-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned emulator dependency
        run: git submodule update --init --depth 1 third_party/mgba
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build libsdl2-dev libfreetype6-dev zlib1g-dev fonts-dejavu-core
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja sdl2
      - name: Build the complete application and regression tests
        shell: bash
        run: |
          args=()
          if [ "$RUNNER_OS" = macOS ]; then args+=("-DCMAKE_OSX_ARCHITECTURES=$(uname -m)"); fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFE8_BUILD_TESTS=ON "${args[@]}"
          cmake --build build --parallel 3
      - name: Run the full regression suite
        run: ctest --test-dir build --output-on-failure
      - name: Capture the native renderer with deterministic fixture data
        shell: bash
        run: |
          mkdir -p build/armory-captures
          build/tests/test_inventory_workspace build/armory-captures
      - uses: actions/upload-artifact@v4
        with:
          name: armory-native-captures-${{ runner.os }}
          path: build/armory-captures/*.ppm
          if-no-files-found: error
          retention-days: 7
      - name: Package Linux regression harnesses for offline ROM testing
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p build/armory-harnesses
          cp build/tests/test_inventory_workspace build/tests/test_inventory_rom build/tests/test_inventory_rom_dense build/armory-harnesses/
          cp LICENSE THIRD_PARTY_NOTICES.md build/armory-harnesses/
          cp third_party/mgba/LICENSE build/armory-harnesses/LICENSE-mGBA
          git rev-parse HEAD > build/armory-harnesses/COMMIT.txt
          # Only executable code and notices. ROMs, saves, fonts, and extracted
          # assets are never uploaded; the test accepts local inputs at runtime.
          tar -C build -czf build/armory-linux-harnesses.tar.gz armory-harnesses
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: armory-linux-harnesses
          path: build/armory-linux-harnesses.tar.gz
          if-no-files-found: error
          retention-days: 7
