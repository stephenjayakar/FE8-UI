name: Validate Armory effective stats
on:
  push:
    branches: [feature/armory-effective-stats]
    paths: [.github/workflows/effective-stats-publish.yml]
permissions:
  contents: read
env:
  FILE_HASHES: |
    {
      "CMakeLists.txt": "0c6a357d981bf324beb60f7064f9b41050933e256a5e818dcdc553d45d7b2657",
      "README.md": "61d9921e7d0fe21b86f08f59a88c4be0e9d1cccd6051069fdd06148810af8535",
      "app/src/inventory_desktop.c": "b277f45ba4a22fd9068dbfbe65c0aade96dc93b397a970b39094ef66c4db73b1",
      "app/src/main.c": "13d3f4a12cc5ec22f194bf2883c3f3523bbe02221e2240b9947459c808da7c49",
      "app/src/prebattle_inventory.c": "9317ab4ec144310564a829ba2169c8b0b55737909115fbabb9f772e95fa265cb",
      "app/src/prebattle_inventory.h": "975d9fd89fb039e1065213c08779c2ffe5b6c86538f3d24a6c9fda00a58f6923",
      "app/src/prebattle_inventory_ui.h": "75ac110aeec62151b7aa3ee345ea5952d61701ca6bb5c3ea2150cc6e8151a0a0",
      "app/src/inventory_effective_stats.c": "b24d4bfafcd9f598199c61e5c0e6e1435aed3ba4e48dffc9a71c46ae835cc304",
      "app/src/inventory_effective_stats.h": "fce0c4defc9a8a307b58df749d86d0a02ce3408d51ee33926dab8200c7e13706",
      "tests/CMakeLists.txt": "0a9e867099565b52a0a3b78a193f83e08dca8b9161a41cf6a08facff9745d017",
      "tests/test_inventory_stats.c": "91319bb2d2b0cae45f21735c15e0a1d4213cc0e9f6a95baf182f616591f0170e",
      "tests/test_inventory_effective_stats.c": "abb90203c7c504e677878ececfaba465b2b196517e367d8abc1af41e3bcf008c",
      "docs/inventory-armory.md": "2e9a7e1f1a15df1c8110cd9ea682a7f78c66ab8cd00771f41524c0ff562b2f94",
      "cmake/MgbaStateCompatibility.cmake": "d8ebc105892f91c43407d26dc0fd97aa872c48a8c951647906d8d2e3b5b37f87"
    }
  APPLY_PATCH: |
    import base64, hashlib, json, lzma, os, subprocess, urllib.request
    from pathlib import Path
    assert os.environ['GITHUB_REF'] == 'refs/heads/feature/armory-effective-stats'
    parts = []
    for sha in ['f462510ebd5e8eb8e41db9a252bac187b5df869b', 'ae4b4fd21b4bbbeda7b438e59740b68eaa408028', 'ef3ba619393f0e470885e3b5d8754d69b1a54fd9', '214ffe9a34993d3aeacd0526689b24cdbc92b18a']:
        url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/' + sha
        request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
        with urllib.request.urlopen(request, timeout=30) as response:
            data = base64.b64decode(json.load(response)['content'])
        assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
        parts.append(data)
    patch = lzma.decompress(base64.b64decode(b''.join(parts)))
    assert hashlib.sha256(patch).hexdigest() == '6f0ce0b8ecbea4ec873d392ea8d2506c5864bc4bde988fc02ac4ccbe55d0712b'
    expected = json.loads(os.environ['FILE_HASHES'])
    names = subprocess.check_output(['git', 'apply', '--unidiff-zero', '--numstat', '-'], input=patch).decode().splitlines()
    assert {line.split('\t')[2] for line in names} == set(expected)
    subprocess.run(['git', 'apply', '--unidiff-zero', '--check', '--whitespace=error', '-'], input=patch, check=True)
    subprocess.run(['git', 'apply', '--unidiff-zero', '--whitespace=error', '-'], input=patch, check=True)
    for name, digest in expected.items():
        assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
    print('Applied and verified 14 source/test/documentation files. No ROMs, saves, fonts or extracted assets.')
jobs:
  validate:
    if: github.ref == 'refs/heads/feature/armory-effective-stats'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-verified source patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 -c "$APPLY_PATCH"
      - name: Initialize pinned emulator
        run: git submodule update --init --depth 1 third_party/mgba
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build libsdl2-dev libfreetype6-dev zlib1g-dev fonts-dejavu-core
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja sdl2
      - name: Build complete application
        shell: bash
        run: |
          args=()
          if [ "$RUNNER_OS" = macOS ]; then args+=("-DCMAKE_OSX_ARCHITECTURES=$(uname -m)"); fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFE8_BUILD_TESTS=ON "${args[@]}"
          cmake --build build --parallel 3
      - name: Full regression suite
        run: ctest --test-dir build --output-on-failure
  publish:
    needs: validate
    if: github.ref == 'refs/heads/feature/armory-effective-stats'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/armory-effective-stats
      - name: Publish validated source and remove temporary transport
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -c "$APPLY_PATCH"
          git diff --check
          python3 -c 'import json,os,subprocess; subprocess.run(["git","add","--",*json.loads(os.environ["FILE_HASHES"])],check=True)'
          git rm .github/workflows/effective-stats-publish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Calculate Armory total stats with native equipment and skill modifiers" -m "Evaluate verified Archanea and Sacred Echoes unit-stat getters in an isolated emulator copy. Add Total/Base toggle and net modifier tooltips, refresh after transfers and undo, and explicitly fall back to base-only on unsupported ROMs. Correct the pinned emulator's unaligned state flags access with a checked build-local fix. Local 34/34 regression tests pass normally and with ASan/UBSan, including both supplied ROMs; native Linux/macOS builds validated. No ROMs, saves, fonts or extracted assets."
          git push origin HEAD:refs/heads/feature/armory-effective-stats
