name: Apply Linux workspace payload

on:
  push:
    branches:
      - linux-workspace-build
    paths:
      - .github/workspace-payload/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workspace-payload/**

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out payload branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: linux-workspace-build

      - name: Decode and apply validated workspace files
        run: |
          set -euo pipefail
          cat .github/workspace-payload/part-* \
            | base64 --decode \
            | tar -xzf - -C .
          rm app/src/host_text_stub.c
          chmod +x build.sh scripts/bootstrap.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path(".github/workflows/linux-workspace.yml")
          path.write_text(path.read_text().rstrip() + "\n")
          PY
          test "$(sha256sum <(cat .github/workspace-payload/part-* | base64 --decode) | cut -d' ' -f1)" \
            = c3c374309713a668947b05dcd280564bf3842e40ddc0b63bb5da7616b7dd3ece

      - name: Commit Linux workspace support
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            CMakeLists.txt \
            README.md \
            THIRD_PARTY_NOTICES.md \
            app/src/font8x8_basic.h \
            app/src/host_cursor.c \
            app/src/host_text.h \
            app/src/host_text_bitmap.c \
            app/src/host_text_macos.m \
            app/src/host_text_stub.c \
            app/src/prebattle_inventory_ui.c \
            build.sh \
            docs/testing.md \
            scripts/bootstrap.sh \
            tests/CMakeLists.txt \
            tests/test_host_text.c \
            tests/test_prebattle_inventory.c
          git diff --cached --check
          git commit -m "build: add portable Linux frontend support"
          git push origin HEAD:linux-workspace-build
